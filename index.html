<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIS Campo</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    padding: 0;
}

#map {
    height: 100vh;
    width: 100vw;
}

.status {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1000;
    padding: 8px 12px;
    border-radius: 10px;
    font-weight: bold;
    color: white;
    font-family: Arial;
}

.online { background: green; }
.offline { background: red; }
</style>
</head>

<body>

<div id="map"></div>
<div id="status" class="status">Cargando...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// =============================
// VARIABLES
// =============================
let map;

let postes = JSON.parse(localStorage.getItem("postes")) || [];
let pendientes = JSON.parse(localStorage.getItem("pendientes")) || [];

// ⚠️ Dejar vacío si no tienes backend aún
const API_URL = "";

// =============================
// GUARDAR STORAGE
// =============================
function saveStorage() {
    localStorage.setItem("postes", JSON.stringify(postes));
    localStorage.setItem("pendientes", JSON.stringify(pendientes));
}

// =============================
// ESTADO ONLINE/OFFLINE
// =============================
function updateStatus() {
    const el = document.getElementById("status");

    if (navigator.onLine) {
        el.textContent = `🟢 Online (${pendientes.length} pendientes)`;
        el.className = "status online";
    } else {
        el.textContent = `🔴 Offline (${pendientes.length} pendientes)`;
        el.className = "status offline";
    }
}

window.addEventListener("online", syncData);
window.addEventListener("offline", updateStatus);

// =============================
// MAPA
// =============================
function initMap() {

    map = L.map("map").setView([4.1420, -73.6266], 14);

    const osm = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        { maxZoom: 19 }
    );

    osm.addTo(map);

    // cargar capa base
    fetch("capas/base.geojson")
        .then(r => r.json())
        .then(data => {
            L.geoJSON(data).addTo(map);
        })
        .catch(() => {
            console.log("GeoJSON no disponible (offline)");
        });

    // cargar postes guardados
    postes.forEach(p => {
        L.marker([p.lat, p.lng]).addTo(map);
    });

    // evento click
    map.on("click", addPoint);
}

// =============================
// AGREGAR PUNTO
// =============================
function addPoint(e) {

    const p = {
        id: Date.now(),
        lat: e.latlng.lat,
        lng: e.latlng.lng,
        synced: false
    };

    postes.push(p);
    pendientes.push(p);

    saveStorage();

    L.marker([p.lat, p.lng])
        .addTo(map)
        .bindPopup("Guardado");

    updateStatus();

    if (navigator.onLine) {
        syncData();
    }
}

// =============================
// SINCRONIZACIÓN
// =============================
async function syncData() {

    updateStatus();

    if (!navigator.onLine || pendientes.length === 0) return;

    // si no hay backend, solo limpia pendientes
    if (!API_URL) {
        pendientes = [];
        saveStorage();
        updateStatus();
        return;
    }

    const nuevos = [];

    for (let p of pendientes) {
        try {
            await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(p)
            });

            p.synced = true;

        } catch {
            nuevos.push(p);
        }
    }

    pendientes = nuevos;
    saveStorage();
    updateStatus();
}

// =============================
// SERVICE WORKER
// =============================
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}

// =============================
// INIT
// =============================
updateStatus();
initMap();
syncData();

</script>

</body>
</html>
