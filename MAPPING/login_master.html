<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07111d" />
<title>PDR-APP | Login Master</title>

<style>
  :root{
    --bg-1:#040b14;
    --bg-2:#07192a;
    --bg-3:#03101d;
    --cyan:#22dff2;
    --cyan-2:#49f1d1;
    --line:rgba(88,220,255,.20);
    --panel:rgba(8,21,36,.42);
    --panel-strong:rgba(8,21,36,.58);
    --text:#f4f9ff;
    --muted:#a8bbcc;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#050d16;
    font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }

  body{
    min-height:100svh;
    overflow:hidden;
    color:var(--text);
  }

  .stage{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 18%, rgba(33,210,245,.12), transparent 24%),
      radial-gradient(circle at 82% 26%, rgba(71,241,209,.08), transparent 18%),
      radial-gradient(circle at 20% 80%, rgba(34,143,255,.07), transparent 24%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  }

  .mesh{
    position:absolute;
    inset:0;
    background:
      linear-gradient(transparent 0 98%, rgba(255,255,255,.018) 100%),
      linear-gradient(90deg, transparent 0 98%, rgba(255,255,255,.016) 100%);
    background-size:72px 72px,72px 72px;
    opacity:.12;
    mask-image:linear-gradient(to bottom, rgba(0,0,0,.75), rgba(0,0,0,.22));
    z-index:0;
    pointer-events:none;
  }

  .ambient{
    position:absolute;
    inset:-10%;
    filter:blur(42px);
    opacity:.65;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 18% 25%, rgba(30,220,255,.12), transparent 20%),
      radial-gradient(circle at 80% 20%, rgba(53,115,255,.10), transparent 20%),
      radial-gradient(circle at 50% 80%, rgba(70,241,209,.09), transparent 18%);
  }

  #networkCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    pointer-events:none;
  }

  .shell{
    position:relative;
    z-index:3;
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
    padding:24px;
  }

  .login-card{
    position:relative;
    width:min(92vw, 470px);
    border-radius:28px;
    padding:34px 30px 28px;
    border:1px solid rgba(92,228,255,.24);
    background:
      linear-gradient(180deg, rgba(10,26,43,.42), rgba(6,18,31,.30));
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      inset 0 -1px 0 rgba(255,255,255,.02),
      0 18px 50px rgba(0,0,0,.35),
      0 0 36px rgba(34,223,242,.10);
    overflow:hidden;
  }

  .login-card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:
      radial-gradient(circle at 18% 0%, rgba(255,255,255,.12), transparent 24%),
      linear-gradient(180deg, rgba(255,255,255,.05), transparent 20%, transparent 80%, rgba(255,255,255,.02));
    opacity:.9;
  }

  .login-card::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.035),
      inset 0 0 22px rgba(41,214,255,.06);
  }

  .brand{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:22px;
    text-align:center;
  }

  .brand-icon{
    width:86px;
    height:86px;
    border-radius:24px;
    position:relative;
    display:grid;
    place-items:center;
    margin-bottom:16px;
    background:
      radial-gradient(circle at 30% 20%, rgba(88,232,255,.08), transparent 28%),
      linear-gradient(180deg, rgba(10,27,44,.62), rgba(6,18,31,.34));
    border:1px solid rgba(92,228,255,.24);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.09),
      0 0 24px rgba(34,223,242,.10);
    overflow:hidden;
  }

  .brand-icon .planet{
    position:absolute;
    width:36px;
    height:36px;
    border-radius:50%;
    border:2px solid rgba(55,232,236,.92);
    opacity:.98;
    box-shadow:0 0 16px rgba(55,232,236,.18);
  }

  .brand-icon .orbit-line{
    position:absolute;
    width:68px;
    height:30px;
    border-top:2.5px solid rgba(73,241,209,.92);
    border-radius:50%;
    transform:rotate(-18deg);
    filter:drop-shadow(0 0 8px rgba(73,241,209,.26));
  }

  .brand-icon .orbit-swoosh{
    position:absolute;
    width:54px;
    height:54px;
    border-top:2.5px solid rgba(55,232,236,.88);
    border-right:2.5px solid rgba(55,232,236,.88);
    border-radius:50%;
    transform:translate(9px,-9px) rotate(14deg);
    opacity:.95;
    filter:drop-shadow(0 0 8px rgba(55,232,236,.18));
    clip-path: inset(0 0 28px 24px);
  }

  .brand-icon .dot{
    position:absolute;
    right:12px;
    top:19px;
    width:9px;
    height:9px;
    border-radius:50%;
    background:#55f2ff;
    box-shadow:0 0 14px rgba(85,242,255,.82);
  }

  .brand-title{
    margin:0;
    font-size:clamp(34px, 6vw, 42px);
    line-height:1;
    font-weight:900;
    letter-spacing:-1.3px;
    text-shadow:0 0 14px rgba(255,255,255,.04);
  }
  .brand-title .accent{
    color:transparent;
    background:linear-gradient(90deg, var(--cyan), var(--cyan-2));
    -webkit-background-clip:text;
    background-clip:text;
  }

  .brand-sub{
    margin-top:10px;
    color:#99b0c2;
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
  }

  .heading{
    position:relative;
    z-index:2;
    text-align:left;
    margin-bottom:22px;
  }

  .heading h2{
    margin:0 0 10px;
    font-size:clamp(28px, 4.2vw, 34px);
    line-height:1.08;
    letter-spacing:-.6px;
  }
  .heading h2 span{ color:var(--cyan); }

  .heading p{
    margin:0;
    color:var(--muted);
    font-size:15px;
    line-height:1.48;
  }

  .field{
    position:relative;
    z-index:2;
    margin-bottom:18px;
  }

  .field label{
    display:block;
    margin-bottom:8px;
    color:#c5d2dd;
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  .input-wrap{
    position:relative;
  }

  .input-icon{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    width:20px;
    height:20px;
    fill:none;
    stroke:#24e6e8;
    stroke-width:1.9;
    pointer-events:none;
    z-index:2;
  }

  .input{
    width:100%;
    height:56px;
    border-radius:15px;
    border:1px solid rgba(104,166,207,.56);
    background:rgba(3,14,25,.66);
    color:var(--text);
    padding:0 48px 0 50px;
    font-size:16px;
    outline:none;
    transition:.2s ease;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.015);
  }

  .input::placeholder{
    color:#90a2b1;
    opacity:1;
  }

  .input:focus{
    border-color:#3ce9ee;
    background:rgba(4,17,29,.86);
    box-shadow:
      0 0 0 1px rgba(60,233,238,.15),
      0 0 16px rgba(60,233,238,.08);
  }

  .eye{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    width:40px;
    height:40px;
    border:0;
    border-radius:12px;
    background:transparent;
    color:#9eb0bf;
    display:grid;
    place-items:center;
    cursor:pointer;
  }
  .eye svg{
    width:20px;
    height:20px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
  }

  .login-btn{
    position:relative;
    z-index:2;
    width:100%;
    height:58px;
    margin-top:4px;
    border:0;
    border-radius:16px;
    cursor:pointer;
    color:#04131b;
    font-size:17px;
    font-weight:800;
    background:linear-gradient(90deg, #1fd0f1, #47efd2);
    box-shadow:
      0 12px 28px rgba(22,214,233,.15),
      0 0 18px rgba(73,241,209,.10);
    transition:transform .18s ease, box-shadow .18s ease;
  }

  .login-btn:hover{
    transform:translateY(-1px);
    box-shadow:
      0 16px 34px rgba(22,214,233,.18),
      0 0 22px rgba(73,241,209,.12);
  }

  .login-btn .arrow{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    width:38px;
    height:38px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:rgba(4,132,145,.12);
    font-size:23px;
    font-weight:400;
  }

  .helper{
    position:relative;
    z-index:2;
    margin-top:20px;
    display:flex;
    align-items:center;
    gap:14px;
    color:#acc0d0;
    font-size:12px;
    line-height:1.35;
    text-align:center;
  }
  .helper::before,.helper::after{
    content:"";
    height:1px;
    flex:1;
    background:#708394;
    opacity:.6;
  }
  .helper span{
    max-width:250px;
  }

  .status{
    position:relative;
    z-index:2;
    min-height:18px;
    margin-top:8px;
    text-align:center;
    font-size:12px;
    color:#7dffe3;
    opacity:0;
    transform:translateY(4px);
    transition:.2s ease;
  }
  .status.show{
    opacity:1;
    transform:none;
  }
  .status.error{ color:#ff9dad; }

  .footer-note{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(170,192,208,.44);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    z-index:2;
    white-space:nowrap;
  }

  @media (min-width: 980px){
    .shell{
      padding:40px;
    }
    .login-card{
      width:min(470px, 31vw);
      padding:36px 32px 30px;
      border-radius:30px;
    }
  }

  @media (max-width: 560px){
    .shell{ padding:18px; }
    .login-card{
      width:100%;
      border-radius:26px;
      padding:30px 22px 24px;
    }
    .brand-icon{
      width:76px;
      height:76px;
      border-radius:22px;
      margin-bottom:14px;
    }
    .brand-sub{
      font-size:10px;
      letter-spacing:.22em;
    }
    .heading p{
      font-size:14px;
    }
    .input{
      height:54px;
      font-size:15px;
    }
    .login-btn{
      height:56px;
      font-size:16px;
    }
    .helper{
      font-size:11px;
      gap:10px;
    }
  }

  @media (max-height: 760px){
    .login-card{
      width:min(92vw, 440px);
      padding:26px 24px 22px;
    }
    .brand{
      margin-bottom:16px;
    }
    .heading{
      margin-bottom:16px;
    }
    .field{
      margin-bottom:14px;
    }
    .helper{
      margin-top:16px;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .login-btn,
    .status,
    .input{ transition:none; }
  }

  .brand-logo-real{
    width:min(82%, 330px);
    max-height:110px;
    object-fit:contain;
    display:block;
    margin:0 auto 8px;
    filter:drop-shadow(0 0 18px rgba(34,223,242,.10));
  }

  .access-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:96px;
    height:28px;
    padding:0 12px;
    margin-top:6px;
    border-radius:999px;
    border:1px solid rgba(73,241,209,.35);
    background:rgba(5,27,40,.52);
    color:#67f4df;
    font-size:11px;
    font-weight:900;
    letter-spacing:.18em;
    text-transform:uppercase;
    box-shadow:0 0 18px rgba(73,241,209,.08);
  }

  .access-badge.master{
    color:#8defff;
    border-color:rgba(34,223,242,.45);
    background:rgba(4,31,48,.62);
  }

  @media (max-width:560px){
    .brand-logo-real{
      width:min(88%, 300px);
      max-height:96px;
      margin-bottom:6px;
    }
    .access-badge{
      height:26px;
      min-width:88px;
      font-size:10px;
    }
  }

</style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="ambient"></div>
    <div class="mesh"></div>
    <canvas id="networkCanvas"></canvas>

    <div class="shell">
      <section class="login-card">
        <div class="brand">
          <img
            class="brand-logo-real"
            src="https://static.wixstatic.com/media/63e6ec_6f519a0e397d4f6fbe3f82ce81606614~mv2.png/v1/fill/w_529,h_173,al_c,q_85,usm_0.66_1.00_0.01,enc_auto/PDR-1.png"
            alt="PDR-APP"
            loading="eager"
            referrerpolicy="no-referrer"
          />
          <div class="access-badge master">MASTER</div>
        </div>

        <div class="heading">
          <h2>Ingreso a <span>PDR-APP MASTER</span></h2>
          <p>Acceso administrativo al panel Master<br>de PDR-APP.</p>
        </div>

        <form id="loginForm">
          <div class="field">
            <label for="email">Correo electrónico</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="m4 7 8 6 8-6"></path>
              </svg>
              <input class="input" id="email" type="email" inputmode="email" autocomplete="username" placeholder="tecnico@empresa.com" required />
            </div>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
              </svg>
              <input class="input" id="password" type="password" autocomplete="current-password" placeholder="Contraseña" required />
              <button class="eye" id="togglePassword" type="button" aria-label="Mostrar contraseña">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                  <circle cx="12" cy="12" r="2.5"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button class="login-btn" type="submit">
            Ingresar
            <span class="arrow">→</span>
          </button>

          <div class="helper">
            <span>Inicia sesión para acceder al panel<br>de administración Master.</span>
          </div>

          <div class="status" id="status"></div>
        </form>
      </section>
    </div>

    <div class="footer-note">PDR-APP · MASTER</div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const LOGIN_MODE='MASTER';
  const DEFAULT_RETURN='master.html';
  const SUPABASE_URL='https://qaypedqascrkmlolmiuf.supabase.co';
  const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFheXBlZHFhc2Nya21sb2xtaXVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA4MDk4NTAsImV4cCI6MjA2NjM4NTg1MH0.Ll6IjEljNK9TUuT1ZdiRP-mtuMRoCKYBWsmgQE4No6g';
  const authSb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

  const pass = document.getElementById('password');
  const eye = document.getElementById('togglePassword');
  const statusEl = document.getElementById('status');
  const submitBtn = document.querySelector('.login-btn');

  function destinoSeguro(){
    const raw=new URLSearchParams(location.search).get('return')||DEFAULT_RETURN;
    const value=String(raw||'').trim();
    if(!value || value.includes('://') || value.startsWith('/') || value.includes('..') || value.includes('\\')){
      return DEFAULT_RETURN;
    }
    return value;
  }

  function irAplicacion(){
    location.replace(destinoSeguro());
  }

  eye.addEventListener('click', () => {
    const show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    eye.style.color = show ? '#32e9ec' : '#9eb0bf';
  });

  async function validarMaster(user){
    const {data,error}=await authSb
      .from('mapping_usuarios')
      .select('id,email,nombre,rol,activo')
      .eq('id',user.id)
      .maybeSingle();

    if(error)throw new Error('No fue posible validar el perfil Master: '+error.message);
    if(!data)throw new Error('El usuario no tiene perfil en mapping_usuarios.');
    if(data.activo===false)throw new Error('El usuario está inactivo.');
    if(!['admin','coordinador'].includes(String(data.rol||'').toLowerCase())){
      throw new Error('Este usuario no tiene permisos de Master.');
    }
    return data;
  }

  async function procesarSesionExistente(){
    try{
      const {data:{session},error}=await authSb.auth.getSession();
      if(error || !session)return;
      if(LOGIN_MODE==='MASTER')await validarMaster(session.user);
      irAplicacion();
    }catch(e){
      await authSb.auth.signOut().catch(()=>{});
      showStatus(e?.message||String(e),true);
    }
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = pass.value;

    if (!email || !password) {
      showStatus('Completa correo y contraseña', true);
      return;
    }

    submitBtn.disabled=true;
    submitBtn.style.opacity='.75';
    showStatus('Validando credenciales...');

    try{
      const {data,error}=await authSb.auth.signInWithPassword({email,password});
      if(error)throw error;
      if(!data?.user)throw new Error('Supabase no devolvió un usuario válido.');

      if(LOGIN_MODE==='MASTER')await validarMaster(data.user);

      showStatus('Acceso correcto. Ingresando...');
      setTimeout(irAplicacion,180);
    }catch(err){
      await authSb.auth.signOut().catch(()=>{});
      showStatus(err?.message||'No fue posible iniciar sesión',true);
      submitBtn.disabled=false;
      submitBtn.style.opacity='';
    }
  });

  function showStatus(msg, error = false){
    statusEl.textContent = msg;
    statusEl.className = 'status show' + (error ? ' error' : '');
    clearTimeout(window._statusTimer);
    if(!error){
      window._statusTimer = setTimeout(() => {
        statusEl.className = 'status';
      }, 2400);
    }
  }

  const msg=new URLSearchParams(location.search).get('msg');
  if(msg)showStatus(msg,true);
  procesarSesionExistente();

  /* Fondo de partículas conectadas */
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('networkCanvas');
  const ctx = canvas.getContext('2d');

  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0, particles = [];

  function resizeNetwork(){
    const rect = stage.getBoundingClientRect();
    W = Math.round(rect.width);
    H = Math.round(rect.height);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const desktop = window.innerWidth >= 900;
    const count = desktop ? 95 : 58;

    particles = Array.from({length: count}, (_, i) => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * (desktop ? 0.28 : 0.34),
      vy: (Math.random() - 0.5) * (desktop ? 0.24 : 0.30),
      r: (desktop ? 1.2 : 1.35) + Math.random() * (desktop ? 1.8 : 2.2),
      seed: Math.random() * 1000 + i * 11,
      glow: 0.45 + Math.random() * 0.55
    }));
  }

  function animateNetwork(t){
    ctx.clearRect(0, 0, W, H);

    const desktop = window.innerWidth >= 900;
    const maxDist = desktop ? 150 : 128;

    for (let i = 0; i < particles.length; i++){
      const p = particles[i];

      p.x += p.vx + Math.sin(t * 0.00035 + p.seed) * 0.05;
      p.y += p.vy + Math.cos(t * 0.00028 + p.seed) * 0.045;

      if (p.x < -12) p.x = W + 12;
      if (p.x > W + 12) p.x = -12;
      if (p.y < -12) p.y = H + 12;
      if (p.y > H + 12) p.y = -12;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(90, 240, 255, ${0.03 + p.glow * 0.06})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(118, 248, 255, ${0.72 + p.glow * 0.18})`;
      ctx.shadowBlur = desktop ? 10 : 12;
      ctx.shadowColor = 'rgba(84,235,255,.34)';
      ctx.fill();

      for (let j = i + 1; j < particles.length; j++){
        const q = particles[j];
        const dx = p.x - q.x;
        const dy = p.y - q.y;
        const d = Math.hypot(dx, dy);

        if (d < maxDist){
          const a = (1 - d / maxDist) * (desktop ? 0.18 : 0.24);
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.lineWidth = d < 70 ? 1 : 0.65;
          ctx.strokeStyle = `rgba(86, 235, 255, ${a})`;
          ctx.shadowBlur = 0;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(animateNetwork);
  }

  resizeNetwork();
  requestAnimationFrame(animateNetwork);
  window.addEventListener('resize', () => {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    resizeNetwork();
  });

</script>
</body>
